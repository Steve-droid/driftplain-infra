# E21/HM5 — bounded quick-tunnel witness (no Cloudflare account needed).
#
# Runs the pinned connector image three times for at most seven minutes in a throwaway
# namespace, each instance opening an anonymous *.trycloudflare.com quick tunnel to the F5
# nginx-ingress ClusterIP over TLS verified against the mounted home-server-ca pool:
#   app       SNI/Host app.home-server.driftplain.dev  → expect the frontend HTML
#   api       SNI/Host api.home-server.driftplain.dev  → expect the API health answer
#   negative  correct SNI but NO CA pool (system roots only) → verification must FAIL: 502
#             from the connector, "x509: certificate signed by unknown authority" in its log
# Nothing is written to the cluster beyond this namespace; delete it afterwards
# (kubectl delete ns hm5-witness). The named-tunnel connector in GitOps replaces all of this.
apiVersion: v1
kind: Namespace
metadata:
  name: hm5-witness
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-ca
  namespace: hm5-witness
data:
  home-server-ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIBjDCCATKgAwIBAgIUQyc0mEzNokFIKLPoVecw8Scv/mEwCgYIKoZIzj0EAwIw
    JDEiMCAGA1UEAxMZZHJpZnRwbGFpbi1ob21lLXNlcnZlci1jYTAeFw0yNjA5MTUx
    NjU1MjNaFw0zNjA5MTIxNjU1MjNaMCQxIjAgBgNVBAMTGWRyaWZ0cGxhaW4taG9t
    ZS1zZXJ2ZXItY2EwWTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAAQXmITTSe2kMSh1
    0CA6/ELbbAnPwrWiMATlZ++AsCQBriS8D9ZVqgaYQwYSfGoI+0dlE93JyAQio916
    O5iQWzDXo0IwQDAOBgNVHQ8BAf8EBAMCAqQwDwYDVR0TAQH/BAUwAwEB/zAdBgNV
    HQ4EFgQUtjuCePvKh15unrpHFKyPhH+dr8MwCgYIKoZIzj0EAwIDSAAwRQIhAPal
    jpWq+qdrBJOPs5knsuqHTWnF0AQYFYSCxLvNghQtAiA54sTnqgI2k/dYwg7BfqZx
    29pOLgjlVKUz85A6qQd9lg==
    -----END CERTIFICATE-----
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quick-tunnel-witness
  namespace: hm5-witness
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quick-tunnel-witness
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000",
                 --url, "https://nginx-ingress-controller.nginx-ingress.svc.cluster.local:443",
                 --origin-ca-pool, /etc/cloudflared/ca/home-server-ca.crt,
                 --origin-server-name, app.home-server.driftplain.dev,
                 --http-host-header, app.home-server.driftplain.dev]
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: &small
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts: &camount
            - { name: origin-ca, mountPath: /etc/cloudflared/ca, readOnly: true }
        - name: api
          image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2001",
                 --url, "https://nginx-ingress-controller.nginx-ingress.svc.cluster.local:443",
                 --origin-ca-pool, /etc/cloudflared/ca/home-server-ca.crt,
                 --origin-server-name, api.home-server.driftplain.dev,
                 --http-host-header, api.home-server.driftplain.dev]
          securityContext: *hardened
          resources: *small
          volumeMounts: *camount
        - name: negative
          image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2002",
                 --url, "https://nginx-ingress-controller.nginx-ingress.svc.cluster.local:443",
                 --origin-server-name, app.home-server.driftplain.dev,
                 --http-host-header, app.home-server.driftplain.dev]
          securityContext: *hardened
          resources: *small
          volumeMounts: *camount
      volumes:
        - name: origin-ca
          configMap:
            name: origin-ca
